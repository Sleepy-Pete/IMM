plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'org.linuxfoundation.imm.player'
    compileSdk 33
    ndkVersion '24.0.8215888'

    defaultConfig {
        applicationId "org.linuxfoundation.imm.player"
        minSdk 26  // Android 8.0 (Oreo) - Required for Meta Quest
        targetSdk 33
        versionCode 1
        versionName "1.0.0"

        // Native build configuration
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -fexceptions -frtti -Wall'
                arguments '-DANDROID_STL=c++_shared',
                          '-DANDROID_PLATFORM=android-26',
                          '-DANDROID_ARM_NEON=TRUE'
                abiFilters 'arm64-v8a'  // Quest uses ARM64
            }
        }

        ndk {
            abiFilters 'arm64-v8a'
        }

        // Copy assets from the android source directory
        sourceSets {
            main {
                assets.srcDirs = ['src/android/assets']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            // Sign with debug key for now (update with release key later)
            signingConfig signingConfigs.debug
        }
        debug {
            debuggable true
            jniDebuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path file('CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
    }

    packagingOptions {
        // Exclude duplicate files
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
    }

    sourceSets {
        main {
            manifest.srcFile 'src/android/AndroidManifest.xml'
            java.srcDirs = ['src/android/java']
            res.srcDirs = ['src/android/res']
            assets.srcDirs = ['src/android/assets']
            jniLibs.srcDirs = ['src/android/jniLibs']
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.20"
    implementation 'androidx.core:core-ktx:1.10.1'  // Downgraded to support compileSdk 33
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'  // Material Components for theme support
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}

